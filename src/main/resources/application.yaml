spring:
  application:
    name: car-rental-backend-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:car_rental}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration


logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com:
      elmangusto:
        carrental: DEBUG
    org:
      hibernate:
        SQL: DEBUG
        orm:
          jdbc:
            bind: TRACE

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,mappings
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN,SUPER_ADMIN
    shutdown:
      enabled: false


admin:
  bootstrap:
    login: ${SUPER_ADMIN_BOOTSTRAP_LOGIN:super_admin}
    password: ${SUPER_ADMIN_BOOTSTRAP_PASSWORD}
    email: ${SUPER_ADMIN_BOOTSTRAP_EMAIL}
    firstName: ${SUPER_ADMIN_BOOTSTRAP_FIRSTNAME}
    lastName: ${SUPER_ADMIN_BOOTSTRAP_LASTNAME}
    phoneNumber: ${SUPER_ADMIN_BOOTSTRAP_PHONENUMBER}